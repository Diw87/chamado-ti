name: Atualizar versão do app

on:
  push:
    paths:
      - '.github/workflows/bust-app-cache.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar referência do app.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('src="app.js"', 'src="app.js?v=20260910-5"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Força carregamento da versão estável do app"
          git push
